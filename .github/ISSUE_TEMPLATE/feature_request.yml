name: Feature Request
description: Suggest an enhancement or new capability for Uni-OCR.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Uni-OCR better or support more formats/engines? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or improvement you propose.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
